<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Begiz</title>
    <!-- The active tab's label uses Format: fetched early so it does not swap in after the first paint. -->
    <link rel="preload" href="/fonts/Format.woff2" as="font" type="font/woff2" crossorigin />

    <style>
      .load-failure {
        margin: 0;
        padding: 32px 16px;
        font-family: ui-monospace, monospace;
        opacity: 0;
        animation: show-load-failure 0s 8s forwards;
      }
      @keyframes show-load-failure {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <!-- Vue replaces this on mount. If the app's JavaScript never loads, the message appears after a few seconds. -->
    <div id="app">
      <p class="load-failure">
        Begiz could not load. Check your connection and
        <a href="">reload the page</a>.
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
